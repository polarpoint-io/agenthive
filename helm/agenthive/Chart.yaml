apiVersion: v2
name: agenthive
description: A shared, reviewed memory graph for a team of coding agents (SQLite
  or Postgres, optional Redis-shared caching/rate-limiting, Prometheus metrics,
  OpenTelemetry tracing)
type: application

# Written by semantic-release from the conventional commits on main; do not
# edit by hand. appVersion is the image tag. build.yml publishes that
# image before this chart is pushed.
version: 1.8.0
