kubeVersion: ">=1.25.0-0"

home: https://github.com/polarpoint-io/agenthive
sources:
  - https://github.com/polarpoint-io/agenthive

keywords:
  - agents
  - memory
  - llm
  - coding-agents
  - opentelemetry

maintainers:
  - name: Polarpoint
    url: https://github.com/polarpoint-io

annotations:
