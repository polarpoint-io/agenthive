apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "agenthive.fullname" . }}-test-connection"
  labels:
    {{- include "agenthive.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: healthz
      image: curlimages/curl:8.10.1
      command:
        - sh
        - -c
        - |
          set -e
          curl -fsS {{ include "agenthive.scheme" . }}://{{ include "agenthive.fullname" . }}:{{ .Values.service.port }}/healthz {{ if .Values.tls.enabled }}--insecure{{ end }}
          curl -fsS {{ include "agenthive.scheme" . }}://{{ include "agenthive.fullname" . }}:{{ .Values.service.port }}/readyz {{ if .Values.tls.enabled }}--insecure{{ end }}
  restartPolicy: Never
