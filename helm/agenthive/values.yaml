# Default values for agenthive.
# See README.md in this directory for a walkthrough of the common
# configurations (SQLite single-replica, Postgres multi-replica, with or
# without Redis and TLS).

replicaCount: 1

image:
  registry: ghcr.io
  repository: polarpoint-io/agenthive
  # Defaults to .Chart.AppVersion if empty - the version this chart itself
  # was released at, since the image and chart are built from the same tag.
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop: ["ALL"]

service:
  type: ClusterIP
  port: 8790

ingress:
  enabled: false
  className: ""
  annotations: {}
  # Example for cert-manager:
  #   cert-manager.io/cluster-issuer: letsencrypt-prod
  host: agenthive.example.com
  path: /
  pathType: Prefix
  tls:
    enabled: false
    secretName: ""

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

# Only meaningful with database.type=postgres - SQLite is a single file,
# so more than one replica means more than one pod writing to (or reading
# a stale view of) the same file, which this chart deliberately refuses
# to render (see templates/_helpers.tpl validation).
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

# --- database ---
database:
  # "sqlite" (default - single replica, backed by a PVC) or "postgres"
  # (any replica count, point at your own Postgres - this chart does not
  # deploy one).
  type: sqlite
  postgres:
    # Either set `url` directly, or point at an existing secret holding
    # the full postgresql:// URL under `existingSecretKey`. If both
    # `existingSecret` and `url` are set, `existingSecret` wins.
    url: ""
    existingSecret: ""
    existingSecretKey: "database-url"

sqlite:
  persistence:
    enabled: true
    size: 1Gi
    storageClassName: ""
    accessModes: ["ReadWriteOnce"]

# --- redis: shares the rate limiter and retrieval cache across replicas.
# Optional with a single replica (both fall back to in-memory); becomes
# a correctness-adjacent concern once you run more than one - see
# ADR.md's "Reliability and observability" section and DEPLOYMENT.md.
# This chart does not deploy Redis itself.
redis:
  url: ""
  existingSecret: ""
  existingSecretKey: "redis-url"

# --- TLS served natively by the app (AGENTHIVE_TLS_CERT_FILE/KEY_FILE).
# Most Kubernetes deployments terminate TLS at the Ingress instead
# (ingress.tls above) and leave this off - enable it only when the
# service must present TLS itself, e.g. with a service mesh sidecar
# expecting HTTPS backends, or with no Ingress in front at all.
tls:
  enabled: false
  # A Secret of type kubernetes.io/tls (keys: tls.crt, tls.key).
  secretName: ""

rateLimit:
  enabled: true
  perMinute: 120
  windowSeconds: 60

# --- auth ---
auth:
  # 0 (default) - tokens never expire on their own, the original behavior.
  # Set to expire new/rotated tokens automatically after this many
  # seconds; only applies going forward, existing tokens are unaffected
  # until next rotated. See DEPLOYMENT.md / ADR.md's "Authentication" section.
  tokenTtlSeconds: 0

  # Azure AD (Microsoft Entra ID) sign-in for the review UI, humans only -
  # off by default, on top of the personal tokens above (which agents keep
  # using unchanged). See ADR.md's "Authentication" section and
  # README.md's/helm/agenthive/README.md's Azure AD walkthrough.
  azureAd:
    enabled: false
    tenantId: ""
    clientId: ""
    # Either set clientSecret directly, or point at an existing secret
    # holding it under existingSecretKey - same existingSecret pattern as
    # database.postgres/redis above. If both are set, existingSecret wins.
    clientSecret: ""
    existingSecret: ""
    existingSecretKey: "client-secret"
    # Must exactly match a Redirect URI registered on the Azure AD App
    # Registration, e.g. https://agenthive.yourcompany.com/auth/azure/callback
    redirectUri: ""
    # How long a session minted by a successful Azure sign-in lasts before
    # the human has to sign in again - deliberately much shorter than
    # tokenTtlSeconds above, since periodic human re-auth is normal and
    # agent re-auth is not.
    sessionTtlSeconds: 3600

cache:
  enabled: true
  ttlSeconds: 300

logging:
  level: INFO
  json: true

metrics:
  enabled: true
  serviceMonitor:
    # Requires the Prometheus Operator CRDs. If you scrape plainly
    # instead, leave this off - podAnnotations already advertise
    # prometheus.io/scrape for that path.
    enabled: false
    interval: 30s
    labels: {}

# --- distributed tracing (OpenTelemetry). Off by default - a fresh
# install pays nothing for this. This chart does not deploy a tracing
# backend itself (same pattern as redis/postgres above) - point
# otlpEndpoint at Jaeger, Tempo, or anything else that speaks OTLP/HTTP.
# See helm/agenthive/README.md's "Tracing" section and ONBOARDING.md.
tracing:
  otlpEndpoint: ""
  # console: true prints each finished span as JSON to the pod's stdout -
  # a zero-infrastructure way to confirm tracing is wired up (`kubectl
  # logs`) before pointing otlpEndpoint at a real backend.
  console: false
  # Head-based sampling ratio, 0.0-1.0. 1.0 (default) traces every
  # request - fine at low/moderate traffic; turn down for a
  # high-throughput deployment rather than paying for and storing a
  # trace per request. See ADR.md's "Reliability and observability" section
  # and DEPLOYMENT.md.
  sampleRatio: 1.0

# Extra environment variables / envFrom, passed straight through - use
# this for anything not already modeled above.
extraEnv: []
extraEnvFrom: []

nodeSelector: {}
tolerations: []
affinity: {}

podDisruptionBudget:
  enabled: false
  minAvailable: 1

# --- Optional standalone review-UI deployment (see ../../ui/Dockerfile in
# the repo root). Off by default - the app's own built-in /ui (at
# service.port above) keeps working either way, so turning this on
# doesn't require turning that off. See this chart's README.md for a
# walkthrough.
ui:
  enabled: false
  replicaCount: 1
  image:
    registry: ghcr.io
    repository: polarpoint-io/agenthive-ui
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent

  # Pre-fills the UI's "Base URL" field with the app's externally-reachable
  # URL (e.g. https://agenthive.example.com) - the field stays editable,
  # this just saves users from typing it in every time.
  apiUrl: ""

  # The UI's own externally-reachable origin once ui.enabled is true (e.g.
  # https://agenthive-ui.example.com, matching ui.ingress.host below) -
  # written into the app's AGENTHIVE_UI_URL (so Azure AD sign-in redirects
  # land here instead of the app's own /ui) and AGENTHIVE_CORS_ORIGIN (so
  # the app accepts browser requests from here). Required for Azure AD
  # sign-in to work against this UI; harmless to leave empty otherwise.
  publicUrl: ""

  service:
    type: ClusterIP
    port: 8080

  ingress:
    enabled: false
    className: ""
    annotations: {}
    host: agenthive-ui.example.com
    path: /
    pathType: Prefix
    tls:
      enabled: false
      secretName: ""

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101
    fsGroup: 101

  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop: ["ALL"]

  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi
