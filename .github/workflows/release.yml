name: release

# Semantic release on every push to main. Conventional commits decide the
# version. The publish step pushes the Docker images for that version
# first (hack/release-images.sh), then semantic-release-helm3 packages and
# pushes the chart. The image therefore exists before the chart that
# references it. A later tag push does not build the image again.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # semantic-release has no way to depend on another workflow, so the chart
  # validation runs here too. Releasing a chart that does not render is worse
  # than releasing nothing.
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5
        with:
          version: v3.16.3

      - name: Install kubeconform
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | sudo tar xz -C /usr/local/bin kubeconform

      - name: Lint, render every scenario, check names
        run: make check

  release:
    needs: [validate]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
      # semantic-release-helm3 pushes the packaged chart to GHCR as an OCI
      # artifact (see the "Semantic Release" step below) - without this the
      # job's GITHUB_TOKEN can log in to ghcr.io but the actual `helm push`
      # gets a 403, and semantic-release exits non-zero even though the
      # commit/tag it already created land fine (its earlier "prepare" step
      # already pushed those before this one fails).
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          # semantic-release reads the whole tag history to work out the last
          # release; a shallow clone makes every run look like the first.
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.POL_GH_TOKEN }}

      - uses: azure/setup-helm@v5
        with:
          version: v3.16.3

      # semantic-release-helm3 shells out to `helm push`, and
      # hack/release-images.sh shells out to `docker buildx`. Both need a
      # GHCR login before the plugin runs. packages:write on this job is
      # what makes the default token able to push.
      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR for image pushes
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@v4
        with:
          extra_plugins: "semantic-release-helm3 @semantic-release/exec @semantic-release/changelog @semantic-release/git"
        env:
          # A PAT rather than the workflow GITHUB_TOKEN so the release commit
          # and tag can be pushed under branch protection. The image build
          # does not depend on that tag: it runs in this job, before the
          # chart publish. The release commit message still carries
          # [skip ci] so the tag push does not start a second release.
          GH_TOKEN: ${{ secrets.POL_GH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.POL_GH_TOKEN }}
