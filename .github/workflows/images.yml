name: images

# Builds the AgentHive image and pushes it to GHCR under this
# repository's owner:
#
#   ghcr.io/polarpoint-io/agenthive

on:
  push:
    # Tags only. semantic-release tags every release on main, so building
    # on branch pushes as well would build this image twice for each one.
    # No `paths:` filter either: GitHub applies those to tag pushes too,
    # and a release commit touches Chart.yaml rather than the app source,
    # which would silently skip the very build the tag exists to trigger.
    tags: ["v*"]
  pull_request:
    paths:
      - "**.py"
      - "Dockerfile"
      - "requirements.txt"
      - ".github/workflows/images.yml"
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/agenthive
          tags: |
            # The v<version> tag semantic-release created; this is what the
            # chart of the same version defaults its image tag to.
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=pr
            type=sha,format=long
            # Releases are the only thing built here now, so every one of them
            # is the latest.
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
          labels: |
            org.opencontainers.image.title=AgentHive
            org.opencontainers.image.description=Shared, reviewed memory graph for a team of coding agents
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Attestations produce an image index, which the runner's classic
          # image store cannot hold - so they are incompatible with `load`.
          # Enable them only on the pushed builds.
          provenance: ${{ github.event_name != 'pull_request' && 'mode=max' || 'false' }}
          sbom: ${{ github.event_name != 'pull_request' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          image="$(echo '${{ steps.meta.outputs.tags }}' | head -n1)"
          docker run -d --name smoke -p 18790:8790 "$image"
          for i in $(seq 1 30); do
            curl -fsS http://localhost:18790/healthz && break || sleep 2
          done
          curl -fsS http://localhost:18790/healthz | grep -qi "ok"
          docker rm -f smoke 2>/dev/null || true

      - name: Report digest
        if: github.event_name != 'pull_request'
        run: |
          echo "### agenthive" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "digest: ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo "tags:" >> "$GITHUB_STEP_SUMMARY"
          echo '${{ steps.meta.outputs.tags }}' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
