name: images

# Smoke-tests the AgentHive images on pull requests, and can republish
# them when dispatched by hand. A merge to main publishes them from
# release.yml instead, tagged with the semantic-release version, before
# the chart. Images:
#
#   ghcr.io/polarpoint-io/agenthive     - the API server (Dockerfile)
#   ghcr.io/polarpoint-io/agenthive-ui  - the standalone review UI
#                                          (ui/Dockerfile) - see
#                                          helm/agenthive/values.yaml's
#                                          ui.image.repository default,
#                                          which expects this to exist.

on:
  # Release images are published from release.yml, inside semantic-release,
  # before the chart. This workflow only smoke-tests pull requests and
  # rebuilds when someone dispatches it (pick the vX.Y.Z tag to republish
  # that version).
  pull_request:
    paths:
      - "**.py"
      - "Dockerfile"
      - "requirements.txt"
      - "ui/**"
      - ".github/workflows/images.yml"
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/agenthive
          tags: |
            # Present when this workflow is dispatched on a vX.Y.Z tag.
            # A normal release publishes this tag from release.yml instead.
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=pr
            type=sha,format=long
            # A dispatch on a release tag also moves latest. A pull request
            # does not.
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
          labels: |
            org.opencontainers.image.title=AgentHive
            org.opencontainers.image.description=Shared, reviewed memory graph for a team of coding agents
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          # A pull request loads the image for the smoke test. The docker
          # exporter cannot hold a multi-arch manifest list, so that build
          # is amd64 only. Tag and dispatch builds still push both platforms.
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Attestations produce an image index, which the runner's classic
          # image store cannot hold - so they are incompatible with `load`.
          # Enable them only on the pushed builds.
          provenance: ${{ github.event_name != 'pull_request' && 'mode=max' || 'false' }}
          sbom: ${{ github.event_name != 'pull_request' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          image="$(echo '${{ steps.meta.outputs.tags }}' | head -n1)"
          docker run -d --name smoke -p 18790:8790 "$image"
          for i in $(seq 1 30); do
            curl -fsS http://localhost:18790/healthz && break || sleep 2
          done
          curl -fsS http://localhost:18790/healthz | grep -qi "ok"
          docker rm -f smoke 2>/dev/null || true

      - name: Report digest
        if: github.event_name != 'pull_request'
        run: |
          echo "### agenthive" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "digest: ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo "tags:" >> "$GITHUB_STEP_SUMMARY"
          echo '${{ steps.meta.outputs.tags }}' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  build-ui:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/agenthive-ui
          tags: |
            # Present when this workflow is dispatched on a vX.Y.Z tag.
            # A normal release publishes this tag from release.yml instead.
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=pr
            type=sha,format=long
            # A dispatch on a release tag also moves latest. A pull request
            # does not.
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
          labels: |
            org.opencontainers.image.title=AgentHive UI
            org.opencontainers.image.description=Standalone review UI for AgentHive - see ui/Dockerfile
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ./ui
          file: ui/Dockerfile
          # Same constraint as the API image: load cannot export a manifest list.
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: ${{ github.event_name != 'pull_request' && 'mode=max' || 'false' }}
          sbom: ${{ github.event_name != 'pull_request' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          image="$(echo '${{ steps.meta.outputs.tags }}' | head -n1)"
          docker run -d --name smoke-ui -p 18080:8080 "$image"
          for i in $(seq 1 30); do
            curl -fsS http://localhost:18080/ && break || sleep 2
          done
          curl -fsS http://localhost:18080/ | grep -qi "AgentHive"
          docker rm -f smoke-ui 2>/dev/null || true

      - name: Report digest
        if: github.event_name != 'pull_request'
        run: |
          echo "### agenthive-ui" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "digest: ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo "tags:" >> "$GITHUB_STEP_SUMMARY"
          echo '${{ steps.meta.outputs.tags }}' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
