<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="982px" preserveAspectRatio="none" style="width:669px;height:982px;" version="1.1" viewBox="0 0 669 982" width="669px" zoomAndPan="magnify"><title>Progressive disclosure - one traversal, two ways to pay for it</title><defs/><g><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="482.0498" x="89.478" y="27.9951">Progressive disclosure - one traversal, two ways to pay for it</text><line style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5.0,5.0;" x1="79" x2="79" y1="104.5938" y2="903.7109"/><line style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5.0,5.0;" x1="357.144" x2="357.144" y1="104.5938" y2="903.7109"/><line style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5.0,5.0;" x1="597.1172" x2="597.1172" y1="104.5938" y2="903.7109"/><rect fill="#E2E2F0" height="30.2969" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="111.7129" x="24" y="73.2969"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="97.7129" x="31" y="93.292">Agent session</text><rect fill="#E2E2F0" height="30.2969" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="111.7129" x="24" y="902.7109"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="97.7129" x="31" y="922.7061">Agent session</text><rect fill="#E2E2F0" height="30.2969" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="86.7549" x="314.144" y="73.2969"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="72.7549" x="321.144" y="93.292">AgentHive</text><rect fill="#E2E2F0" height="30.2969" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="86.7549" x="314.144" y="902.7109"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="72.7549" x="321.144" y="922.7061">AgentHive</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="112.8887" x="538.1172" y="101.292">Approved graph</text><path d="M579.5615,52.2969 C579.5615,42.2969 597.5615,42.2969 597.5615,42.2969 C597.5615,42.2969 615.5615,42.2969 615.5615,52.2969 L615.5615,78.2969 C615.5615,88.2969 597.5615,88.2969 597.5615,88.2969 C597.5615,88.2969 579.5615,88.2969 579.5615,78.2969 L579.5615,52.2969 " fill="#E2E2F0" style="stroke:#181818;stroke-width:1.5;"/><path d="M579.5615,52.2969 C579.5615,62.2969 597.5615,62.2969 597.5615,62.2969 C597.5615,62.2969 615.5615,62.2969 615.5615,52.2969 " fill="none" style="stroke:#181818;stroke-width:1.5;"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="112.8887" x="538.1172" y="915.7061">Approved graph</text><path d="M579.5615,929.0078 C579.5615,919.0078 597.5615,919.0078 597.5615,919.0078 C597.5615,919.0078 615.5615,919.0078 615.5615,929.0078 L615.5615,955.0078 C615.5615,965.0078 597.5615,965.0078 597.5615,965.0078 C597.5615,965.0078 579.5615,965.0078 579.5615,955.0078 L579.5615,929.0078 " fill="#E2E2F0" style="stroke:#181818;stroke-width:1.5;"/><path d="M579.5615,929.0078 C579.5615,939.0078 597.5615,939.0078 597.5615,939.0078 C597.5615,939.0078 615.5615,939.0078 615.5615,929.0078 " fill="none" style="stroke:#181818;stroke-width:1.5;"/><rect fill="#EEEEEE" height="3" style="stroke:#EEEEEE;stroke-width:1.0;" width="662.0059" x="0" y="135.1602"/><line style="stroke:#000000;stroke-width:1.0;" x1="0" x2="662.0059" y1="135.1602" y2="135.1602"/><line style="stroke:#000000;stroke-width:1.0;" x1="0" x2="662.0059" y1="138.1602" y2="138.1602"/><rect fill="#EEEEEE" height="23.1328" style="stroke:#000000;stroke-width:2.0;" width="260.1113" x="200.9473" y="124.5938"/><text fill="#000000" font-family="Helvetica" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="241.5854" x="206.9473" y="140.6606">The default: one call, every body</text><polygon fill="#181818" points="345.5215,174.8594,355.5215,178.8594,345.5215,182.8594,349.5215,178.8594" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="79.8564" x2="351.5215" y1="178.8594" y2="178.8594"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="161.8462" x="86.8564" y="173.7935">retrieve_context(anchor)</text><polygon fill="#181818" points="585.5615,203.9922,595.5615,207.9922,585.5615,211.9922,589.5615,207.9922" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="357.5215" x2="591.5615" y1="207.9922" y2="207.9922"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="192.7783" x="364.5215" y="202.9263">approved nodes for this team</text><polygon fill="#181818" points="368.5215,233.125,358.5215,237.125,368.5215,241.125,364.5215,237.125" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="362.5215" x2="596.5615" y1="237.125" y2="237.125"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="39.2158" x="374.5215" y="232.0591">nodes</text><line style="stroke:#181818;stroke-width:1.0;" x1="357.5215" x2="399.5215" y1="281.3906" y2="281.3906"/><line style="stroke:#181818;stroke-width:1.0;" x1="399.5215" x2="399.5215" y1="281.3906" y2="294.3906"/><line style="stroke:#181818;stroke-width:1.0;" x1="358.5215" x2="399.5215" y1="294.3906" y2="294.3906"/><polygon fill="#181818" points="368.5215,290.3906,358.5215,294.3906,368.5215,298.3906,364.5215,294.3906" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="119.1138" x="364.5215" y="261.1919">bounded traversal</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="116.0796" x="364.5215" y="276.3247">(hops, hub cutoff)</text><polygon fill="#181818" points="90.8564,334.6563,80.8564,338.6563,90.8564,342.6563,86.8564,338.6563" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="84.8564" x2="356.5215" y1="338.6563" y2="338.6563"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="190.6963" x="96.8564" y="318.4575">neighbourhood + every body</text><text fill="#000000" font-family="Helvetica" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="193.8066" x="96.8564" y="333.5903">~2,300 tokens for 5 nodes</text><path d="M84,351.6563 L84,421.6563 L329,421.6563 L329,361.6563 L319,351.6563 L84,351.6563 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M319,351.6563 L319,361.6563 L329,361.6563 L319,351.6563 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="224.1421" x="90" y="368.7231">One round trip, nothing wasted on</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="210.7485" x="90" y="383.856">a second call. The right default -</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="203.4233" x="90" y="398.9888">and it bills for bodies the agent</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="209.8979" x="90" y="414.1216">would have skipped given titles.</text><rect fill="#EEEEEE" height="3" style="stroke:#EEEEEE;stroke-width:1.0;" width="662.0059" x="0" y="447.7539"/><line style="stroke:#000000;stroke-width:1.0;" x1="0" x2="662.0059" y1="447.7539" y2="447.7539"/><line style="stroke:#000000;stroke-width:1.0;" x1="0" x2="662.0059" y1="450.7539" y2="450.7539"/><rect fill="#EEEEEE" height="23.1328" style="stroke:#000000;stroke-width:2.0;" width="357.5352" x="152.2354" y="437.1875"/><text fill="#000000" font-family="Helvetica" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="339.0093" x="158.2354" y="453.2544">The alternative: see the price before paying it</text><polygon fill="#181818" points="345.5215,487.4531,355.5215,491.4531,345.5215,495.4531,349.5215,491.4531" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="79.8564" x2="351.5215" y1="491.4531" y2="491.4531"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="253.665" x="86.8564" y="486.3872">retrieve_context(anchor, mode=index)</text><line style="stroke:#181818;stroke-width:1.0;" x1="357.5215" x2="399.5215" y1="535.7188" y2="535.7188"/><line style="stroke:#181818;stroke-width:1.0;" x1="399.5215" x2="399.5215" y1="535.7188" y2="548.7188"/><line style="stroke:#181818;stroke-width:1.0;" x1="358.5215" x2="399.5215" y1="548.7188" y2="548.7188"/><polygon fill="#181818" points="368.5215,544.7188,358.5215,548.7188,368.5215,552.7188,364.5215,548.7188" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="128.1021" x="364.5215" y="515.52">the SAME traversal,</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="226.04" x="364.5215" y="530.6528">served from the SAME cache entry</text><polygon fill="#181818" points="90.8564,604.1172,80.8564,608.1172,90.8564,612.1172,86.8564,608.1172" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="84.8564" x2="356.5215" y1="608.1172" y2="608.1172"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="136.665" x="96.8564" y="572.7856">ids, titles, tiers, tags,</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="130.7808" x="96.8564" y="587.9185">per-node token cost</text><text fill="#000000" font-family="Helvetica" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="83.1099" x="96.8564" y="603.0513">~40 tokens</text><path d="M84,621.1172 L84,676.1172 L319,676.1172 L319,631.1172 L309,621.1172 L84,621.1172 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M309,621.1172 L309,631.1172 L319,631.1172 L309,621.1172 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="212.3418" x="90" y="638.1841">Now the agent can choose. Tags</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="214.0938" x="90" y="653.3169">narrow it further without reading</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="91" x="90" y="668.4497">a single body.</text><polygon fill="#181818" points="345.5215,698.6484,355.5215,702.6484,345.5215,706.6484,349.5215,702.6484" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="79.8564" x2="351.5215" y1="702.6484" y2="702.6484"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="139.2485" x="86.8564" y="697.5825">fetch_nodes([one id])</text><polygon fill="#181818" points="585.5615,727.7813,595.5615,731.7813,585.5615,735.7813,589.5615,731.7813" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="357.5215" x2="591.5615" y1="731.7813" y2="731.7813"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="192.7783" x="364.5215" y="726.7153">approved nodes for this team</text><polygon fill="#181818" points="368.5215,756.9141,358.5215,760.9141,368.5215,764.9141,364.5215,760.9141" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="362.5215" x2="596.5615" y1="760.9141" y2="760.9141"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="39.2158" x="374.5215" y="755.8481">nodes</text><polygon fill="#181818" points="90.8564,801.1797,80.8564,805.1797,90.8564,809.1797,86.8564,805.1797" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;stroke-dasharray:2.0,2.0;" x1="84.8564" x2="356.5215" y1="805.1797" y2="805.1797"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="90.5366" x="96.8564" y="784.981">just that body</text><text fill="#000000" font-family="Helvetica" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="92.1553" x="96.8564" y="800.1138">~460 tokens</text><path d="M5,818.1797 L5,888.1797 L432,888.1797 L432,828.1797 L422,818.1797 L5,818.1797 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M422,818.1797 L422,828.1797 L432,828.1797 L422,818.1797 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="136.7603" x="11" y="835.2466">500 against 2,300.</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="265.8271" x="151.8926" y="835.2466">The saving is the four bodies never sent.</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="401.7559" x="11" y="850.3794">An agent that fetches all five has saved nothing and spent an</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="373.585" x="11" y="865.5122">extra round trip - which is why retrieve_context stays the</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="388.5718" x="11" y="880.645">default, and why the metrics report both halves separately.</text><!--SRC=[hLN1Zjis4BthAmQvPEFQHffkWc815zXkK-IIx289q4Es24RYI6IN9bMIi