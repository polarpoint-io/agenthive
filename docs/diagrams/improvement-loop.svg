<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="641px" preserveAspectRatio="none" style="width:1304px;height:641px;" version="1.1" viewBox="0 0 1304 641" width="1304px" zoomAndPan="magnify"><title>How the graph improves itself - and where it stops</title><defs/><g><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="402.2744" x="444.0028" y="22.9951">How the graph improves itself - and where it stops</text><!--cluster use--><g id="cluster_use"><rect fill="#E6F1FB" height="120" rx="2.5" ry="2.5" style="stroke:#888888;stroke-width:1.0;" width="911" x="127.28" y="44.2969"/><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="29.1963" x="568.1819" y="59.292">Use</text></g><!--cluster prop--><g id="cluster_prop"><rect fill="#FAEEDA" height="136" rx="2.5" ry="2.5" style="stroke:#888888;stroke-width:1.0;" width="1138" x="160.28" y="213.2969"/><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="77.335" x="690.6125" y="228.292">Proposals</text><text fill="#000000" font-family="Helvetica" font-size="14" font-style="italic" font-weight="bold" lengthAdjust="spacing" textLength="252.9023" x="602.8288" y="244.5889">arithmetic over rows - no model</text></g><!--entity acc--><g id="elem_acc"><rect fill="#F5F5F5" height="52.5938" rx="2.5" ry="2.5" style="stroke:#888888;stroke-width:0.5;" width="248.6348" x="494.78" y="87.2969"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="122.0352" x="504.78" y="110.292">Retrievals served</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="228.6348" x="504.78" y="126.5889">(access log, shared retrieval ids)</text></g><!--entity miss--><g id="elem_miss"><rect fill="#F5F5F5" height="52.5938" rx="2.5" ry="2.5" style="stroke:#888888;stroke-width:0.5;" width="235.2295" x="778.78" y="87.2969"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="205.4951" x="788.78" y="110.292">Retrievals that found nothing</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="215.2295" x="788.78" y="126.5889">(miss log, counted per anchor)</text></g><!--entity rev--><g id="elem_rev"><rect fill="#F5F5F5" height="52.5938" rx="2.5" ry="2.5" style="stroke:#888888;stroke-width:0.5;" width="289.3359" x="170.78" y="87.2969"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="181.6992" x="180.78" y="110.292">Approve / reject decisions</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="269.3359" x="180.78" y="126.5889">(labelled, free, nobody else has these)</text></g><!--entity links--><g id="elem_links"><rect fill="#F5F5F5" height="52.5938" rx="2.5" ry="2.5" style="stroke:#888888;stroke-width:0.5;" width="202.6699" x="461.78" y="272.2969"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="182.6699" x="471.78" y="295.292">Links the graph is missing</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="174.6787" x="471.78" y="311.5889">(co-retrieved, not linked)</text></g><!--entity tiers--><g id="elem_tiers"><rect fill="#F5F5F5" height="52.5938" rx="2.5" ry="2.5" style="stroke:#888888;stroke-width:0.5;" width="258.5469" x="699.78" y="272.2969"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="219.8369" x="709.78" y="295.292">Tier promotions and demotions</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="238.5469" x="709.78" y="311.5889">(by distinct users, not repeat hits)</text></g><!--entity gaps--><g id="elem_gaps"><rect fill="#F5F5F5" height="52.5938" rx="2.5" ry="2.5" style="stroke:#888888;stroke-width:0.5;" width="279.8818" x="994.28" y="272.2969"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="122.8896" x="1004.28" y="295.292">Gaps worth filling</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="259.8818" x="1004.28" y="311.5889">(and which are already in the queue)</text></g><!--entity rules--><g id="elem_rules"><rect fill="#F5F5F5" height="52.5938" rx="2.5" ry="2.5" style="stroke:#888888;stroke-width:0.5;" width="223.2734" x="203.78" y="272.2969"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="203.2734" x="213.78" y="295.292">Auto-approve rules your own</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="169.1416" x="213.78" y="311.5889">decisions already justify</text></g><!--entity human--><g id="elem_human"><rect fill="#E1F5EE" height="36.2969" rx="2.5" ry="2.5" style="stroke:#888888;stroke-width:0.5;" width="154.9824" x="571.78" y="459.7969"/><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="134.9824" x="581.78" y="482.792">A human decides</text></g><!--entity agentw--><g id="elem_agentw"><rect fill="#E1F5EE" height="36.2969" rx="2.5" ry="2.5" style="stroke:#888888;stroke-width:0.5;" width="217.0049" x="915.78" y="459.7969"/><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="197.0049" x="925.78" y="482.792">An agent writes the note</text></g><!--entity better--><g id="elem_better"><rect fill="#EAF3DE" height="68.8906" rx="2.5" ry="2.5" style="stroke:#888888;stroke-width:0.5;" width="200.9199" x="548.78" y="566.2969"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="88.9971" x="558.78" y="589.292">Better graph</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="155.9551" x="558.78" y="605.5889">&#8594; more exact anchors</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="180.9199" x="558.78" y="621.8857">&#8594; fewer wasted retrievals</text></g><g id="elem_GMN25"><path d="M81.78,450.2969 L81.78,505.6953 L537.0739,505.6953 L537.0739,460.2969 L527.0739,450.2969 L81.78,450.2969 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M527.0739,450.2969 L527.0739,460.2969 L537.0739,460.2969 L527.0739,450.2969 " fill="#FEFFDD" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="433.7798" x="87.78" y="467.3638">Nothing here applies itself. Poison what gets consolidated and you</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="434.2939" x="87.78" y="482.4966">poison every future retrieval, so the approval gate is the defence -</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="335.3022" x="87.78" y="497.6294">a proposal that applied itself would route around it.</text></g><!--link acc to links--><g id="link_acc_links"><path d="M611.38,140.6269 C600.71,175.5069 583.5554,231.5494 572.9054,266.3594 " fill="none" id="acc-to-links" style="stroke:#555555;stroke-width:1.0;"/><polygon fill="#555555" points="571.15,272.0969,577.608,264.6609,572.6128,267.3156,569.9581,262.3204,571.15,272.0969" style="stroke:#555555;stroke-width:1.0;"/></g><!--link acc to tiers--><g id="link_acc_tiers"><path d="M648.93,140.6269 C688.95,175.5069 755.3268,233.3447 795.2668,268.1547 " fill="none" id="acc-to-tiers" style="stroke:#555555;stroke-width:1.0;"/><polygon fill="#555555" points="799.79,272.0969,795.6334,263.1681,796.0207,268.8117,790.3771,269.199,799.79,272.0969" style="stroke:#555555;stroke-width:1.0;"/></g><!--link miss to gaps--><g id="link_miss_gaps"><path d="M929.63,140.4369 C974.92,175.2569 1050.6532,233.4999 1096.0232,268.3799 " fill="none" id="miss-to-gaps" style="stroke:#555555;stroke-width:1.0;"/><polygon fill="#555555" points="1100.78,272.0369,1096.0828,263.3803,1096.816,268.9894,1091.2069,269.7226,1100.78,272.0369" style="stroke:#555555;stroke-width:1.0;"/></g><!--link rev to rules--><g id="link_rev_rules"><path d="M315.28,140.6269 C315.28,175.5069 315.28,231.2869 315.28,266.0969 " fill="none" id="rev-to-rules" style="stroke:#555555;stroke-width:1.0;"/><polygon fill="#555555" points="315.28,272.0969,319.28,263.0969,315.28,267.0969,311.28,263.0969,315.28,272.0969" style="stroke:#555555;stroke-width:1.0;"/></g><!--link links to human--><g id="link_links_human"><path d="M575.79,325.5369 C593.59,362.1569 623.1177,422.9403 638.2977,454.1803 " fill="none" id="links-to-human" style="stroke:#555555;stroke-width:1.0;"/><polygon fill="#555555" points="640.92,459.5769,640.5843,449.7337,638.7347,455.0797,633.3888,453.2301,640.92,459.5769" style="stroke:#555555;stroke-width:1.0;"/></g><!--link tiers to human--><g id="link_tiers_human"><path d="M803.11,325.5369 C765.86,362.1569 702.8482,424.1301 671.0782,455.3701 " fill="none" id="tiers-to-human" style="stroke:#555555;stroke-width:1.0;"/><polygon fill="#555555" points="666.8,459.5769,676.0218,456.1188,670.3651,456.0712,670.4127,450.4145,666.8,459.5769" style="stroke:#555555;stroke-width:1.0;"/></g><!--link rules to human--><g id="link_rules_human"><path d="M363.49,325.3469 C432.69,362.0169 552.9783,425.7576 611.8783,456.9676 " fill="none" id="rules-to-human" style="stroke:#555555;stroke-width:1.0;"/><polygon fill="#555555" points="617.18,459.7769,611.1003,452.0285,612.7619,457.4358,607.3546,459.0974,617.18,459.7769" style="stroke:#555555;stroke-width:1.0;"/></g><!--link gaps to agentw--><g id="link_gaps_agentw"><path d="M1118.29,325.5369 C1095.53,362.1569 1057.5665,423.2405 1038.1565,454.4805 " fill="none" id="gaps-to-agentw" style="stroke:#555555;stroke-width:1.0;"/><polygon fill="#555555" points="1034.99,459.5769,1043.1373,454.0433,1037.6287,455.3299,1036.3421,449.8213,1034.99,459.5769" style="stroke:#555555;stroke-width:1.0;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="77.7334" x="1086.28" y="393.8638">report_gaps</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="65.0635" x="1092.615" y="408.9966">[member]</text></g><!--link human to better--><g id="link_human_better"><path d="M649.28,495.8769 C649.28,513.9869 649.28,537.0669 649.28,559.8669 " fill="none" id="human-to-better" style="stroke:#555555;stroke-width:1.0;"/><polygon fill="#555555" points="649.28,565.8669,653.28,556.8669,649.28,560.8669,645.28,556.8669,649.28,565.8669" style="stroke:#555555;stroke-width:1.0;"/></g><!--link agentw to better--><g id="link_agentw_better"><path d="M971.35,495.8769 C914.01,514.3769 826.9,542.4841 755.6,565.4941 " fill="none" id="agentw-to-better" style="stroke:#555555;stroke-width:1.0;"/><polygon fill="#555555" points="749.89,567.3369,759.6835,568.3794,754.6483,565.8013,757.2265,560.7661,749.89,567.3369" style="stroke:#555555;stroke-width:1.0;"/></g><!--link better to use--><g id="link_better_use"><path d="M548.69,598.2469 C398.6,593.6069 126.94,575.4669 64.28,505.2969 C6,440.0169 23.02,343.4019 54.9713,262.6081 C70.9469,222.2113 90.6553,185.7697 106.5505,159.178 C114.498,145.8821 121.4923,135.0487 126.59,127.4146 C126.7493,127.176 123.5681,131.9259 123.7236,131.6936 " fill="none" id="better-to-use" style="stroke:#555555;stroke-width:1.0;"/><polygon fill="#555555" points="127.0623,126.7083,118.7307,131.9604,124.2801,130.8627,125.3778,136.412,127.0623,126.7083" style="stroke:#555555;stroke-width:1.0;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="87.6548" x="47.3769" y="386.3638">and the cycle</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="99.5566" x="41.426" y="401.4966">measures itself</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="125.8486" x="28.28" y="416.6294">(gaps_closed_total)</text></g><!--link prop to GMN25--><g id="link_prop_GMN25"><path d="M180.3595,349.5353 C180.4489,349.7558 180.5389,349.976 180.6296,350.196 C181.3547,351.956 182.1196,353.7005 182.9262,355.4177 C184.5392,358.852 186.3188,362.1769 188.28,365.2969 C209.72,399.3969 244.25,429.7569 270.95,450.1569 " fill="none" id="prop-GMN25" style="stroke:#555555;stroke-width:1.0;stroke-dasharray:7.0,7.0;"/></g><!--SRC=[TLN1Zjis4BthAmRhGnfZlKPGR57aKC2RsCcX28AYFTN5WfP64hCKHo4fgqQHQp-WdzWlwICfUnKNyHxM96SUPzvx7B-WzpBIu9aEN4h7ddJNEpbonpRSqVR8xaJAEGJ944Xgkldef1UlZByX7wJtf4BnWXIrGwSihIYqAf3s-CzKiTUDlIKh0H56TpgeeCNU5Vv9sruvrT51bK-Day5MRyI8e-2KzJX20RCetwfAHcqRgd4rpqughjLWmavi-A0wflTiZXnqgMOnczX1Xb_Sfy_iq74Pb6qCqry5qOEuYjqK-sFwnDsh8XUx-_XNV2cAe0DI8usnuyQflZsJ23Q3PrE35MKh6bjsZAtCMr4yNtopNFxcURcy8UMJ6elj3xjNkuTKqIpi5mvEyn4Ca6Ttv6fllrDboTwJaUOsikIuGiOKHhhoBnCeehu9bHIhOtDHg1Oa0xRJPz0I9m6eFJkqKRRYCcIC-1fpqwUsQOtDJzY6DgNsqDi3qAW36yFLBTMEENhY8DM966fIgv9VF6TanyV8x5VyN6otNExjUgsS3cqNTIRSw0ZwUj1iXJgfsApN2GZbzD1gizs-tLnp-REsJtwkMUueTr_AQY8n5XpjQn3ELQulVhzg_LUD8d1T9z7VFkbTyRG2uE54bVP1Mx02WPtFg8vx1lajV9AX0t2keDyfFB9HN6YfriRa0hEVTDdYTJ8furY1J6rJGvy77YOg6oHVYJG4MQb9AJSOkFGaWoCPxTvU1Bj0VXfGTNtAkiJe_ocpcPv-pCM3droSznRRLxlxxVOgmP9gyBnfX8YSDG0PP_-di_6IEizzu130Sn9iR__z-n-eZVRvJmLQipTztgzvHE2eV9Y_1vykE6IKnNQp-_ujBi3ReDNgfqdMyoehaPv1N2OYOSoqo4GKAI5jf6wBb39RPtQVrn4ZBQSMNqVz8UnZFDZRtplk3kp-A8ffbY8orrfC2RETgOcu4mV6w-Iuo6HvAWtlRSVA3-uoWc2PUCbZQSHpzHWaAFEoA2BjT90Gf8l3FRuNkEL3dWAKvXMiOlG5vuu-YlPYOJxujk7WCH-i5wCh5QcELS1E0Ebp7AUVa7e8AEPP28mgITLc8s9IDKX__jcesPPCAy2eL5Hy-NbEvNAgysGTPJ0G63zEm4e36YTt1UTPniL_]--></g></svg>